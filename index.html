<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
</head>
<body>

    <div id="parant">
       <div id="box">
        <div class="cell" id="1" onclick="playerClick('0')"></div>
        <div class="cell" id="2" onclick="playerClick('1')"></div>
        <div class="cell" id="3" onclick="playerClick('2')"></div>
        <div class="cell" id="4" onclick="playerClick('3')"></div>
        <div class="cell" id="5" onclick="playerClick('4')"></div>
        <div class="cell" id="6" onclick="playerClick('5')"></div>
        <div class="cell" id="7" onclick="playerClick('6')"></div>
        <div class="cell" id="8" onclick="playerClick('7')"></div>
        <div class="cell" id="9" onclick="playerClick('8')"></div>
       </div>
     
    </div>
      <h3 style="font-size: 30px;">Your Turn's</h3>
       <button onclick="Restart()">Restart</button>
    <script src="script.js"></script>
</body>
</html>
